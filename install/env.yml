# Conda environment for MATdetangler — minimal, unpinned.
#
#   conda env create -f install/env.yml
#   conda activate MATdetangler
#
# Pipeline depends only on standard libs + a few command-line tools:
#   - BLAST+   (makeblastdb, blastn, tblastn) — sequence search
#   - mafft                                    — pairwise & multi-seq alignment
#   - matplotlib                               — bubble.png rendering
#   - edlib    (pip)                           — RC-aware edit-distance dedup
#
# Optional (only when using --no-skip-consensus):
#   - bowtie2, samtools                        — read-derived consensus step
#
# Optional (only for the MATdetangler-spades wrapper):
#   - spades.py                                — per-k assembly builder
name: MATdetangler
channels:
  - bioconda
  - conda-forge
dependencies:
  - python>=3.9
  - matplotlib
  - blast
  - mafft
  - pip
  - pip:
      - edlib

  # consensus step (optional — only when --no-skip-consensus).
  # samtools >= 1.16 required for `samtools consensus` (introduced Aug 2022).
  - bowtie2
  - samtools>=1.16

  # upstream assembly wrapper (optional)
  - spades

  # large-file storage for examples/Pcub40/*.gfa.gz checked into the repo
  - git-lfs
