# Conda environment for MATdetangler.
#
#   conda env create -f install/env.yml      # one-time setup (~5 min)
#   conda activate matdetangler
#   python -m unittest discover -s test -p 'test_*.py'    # 195 tests, ~1 sec
#
# External binaries the pipeline calls (audited from matdetangler/*.py code):
#
# ALWAYS REQUIRED (reads-free steps 1-6 — the default pipeline):
#   * makeblastdb, tblastn, blastn, tblastx   — step 1 (input_process),
#                                              step 2 (anchor_search contigs/segments),
#                                              step 3 (graph_path_search seg labeling),
#                                              step 4 (repeat_stitch, only with --repeats),
#                                              step 5 (pick_alleles completeness),
#                                              step 6 (graph_paths annotation)
#   * mafft                                   — step 3 (cluster_alleles HD-core MSA dedup),
#                                              step 5 (_is_dup pairwise duplicate check),
#                                              step 8 (consensus_qc identity re-check)
#   * python>=3.9                             — every step (pure stdlib + matplotlib;
#                                                no biopython / numpy / pandas)
#   * matplotlib                              — step 6 (bubble.png allele walk rendering)
#
# OPTIONAL — only when --no-skip-consensus (default OFF after 2026-05-30 reads-free refactor):
#   * bowtie2, bowtie2-build                  — step 7 (map_consensus competitive mapping)
#   * samtools                                — step 7 (sort/index/depth/consensus per allele)
#
# OPTIONAL — only when running the upstream assembly wrapper:
#   * spades.py                               — MATdetangler-spades (per-k SPAdes builder).
#                                              The main pipeline ACCEPTS pre-built SPAdes
#                                              output and never invokes spades itself.
#
# DEPRECATED / DELETED — DO NOT list:
#   * bowtie2 for genome-cov estimation       — old step 2.05 deleted 2026-05-30;
#                                              genome cov now from SPAdes contigs.fasta `cov_`.
#   * old hash-keyed blast cache              — replaced by descriptive blast_*.tsv files.
#
# Tested on linux-64 (Great Lakes HPC, Anaconda 23.x, Mamba 1.x; Python 3.11 in dev).
name: matdetangler
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # core (always required)
  - python>=3.9
  - matplotlib
  - blast=2.16          # supplies makeblastdb, blastn, tblastn, tblastx
  - mafft

  # consensus step (only used when --no-skip-consensus)
  - bowtie2>=2.4
  - samtools>=1.15

  # upstream assembly (only for MATdetangler-spades wrapper)
  - spades>=3.15
